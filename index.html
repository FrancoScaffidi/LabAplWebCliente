<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiTienda - E-commerce</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Tipografia de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Mi hoja de estilos -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ================= HEADER / NAVBAR ================= -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark barra-principal">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <i class="bi bi-bag-heart-fill"></i> MiTienda
        </a>

        <!-- boton hamburguesa para mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"
                aria-controls="menuNav" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNav">
          <!-- icono carrito con el badge -->
          <button class="btn btn-carrito position-relative ms-lg-auto mt-3 mt-lg-0" type="button"
                  data-bs-toggle="offcanvas" data-bs-target="#sidebarCarrito" aria-label="Abrir carrito">
            <i class="bi bi-cart3 fs-5"></i>
            <span id="badgeCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              0
            </span>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <!-- ================= CONTENIDO PRINCIPAL ================= -->
  <main class="container my-4">

    <section aria-labelledby="tituloProductos">
      <h1 id="tituloProductos" class="titulo-seccion">Nuestros productos</h1>

      <!-- spinner mientras carga la api -->
      <div id="cargando" class="text-center my-5">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2">Cargando productos...</p>
      </div>

      <!-- aca se cargan las cards de los productos -->
      <div id="contenedorProductos" class="row g-4"></div>
    </section>

  </main>

  <!-- ================= MODAL DETALLE PRODUCTO ================= -->
  <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModal">Detalle del producto</h5>
          <div class="precio-modal ms-auto me-2" id="precioModal">$ 0</div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body text-center">
          <img id="imagenModal" src="" alt="Imagen del producto" class="imagen-modal mb-3">
          <p id="descripcionModal" class="text-start text-muted"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-agregar w-100" id="btnAgregarModal">
            <i class="bi bi-cart-plus"></i> Agregar al carrito
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= SIDEBAR CARRITO ================= -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="sidebarCarrito" aria-labelledby="tituloCarrito">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="tituloCarrito">Lista de productos</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column">
      <!-- listado de productos del carrito -->
      <div id="itemsCarrito" class="flex-grow-1"></div>

      <!-- mensaje carrito vacio -->
      <div id="carritoVacio" class="text-center text-muted my-auto">
        <i class="bi bi-cart-x fs-1"></i>
        <p class="mt-2">Tu carrito esta vacio</p>
      </div>

      <!-- botones finales -->
      <div id="accionesCarrito" class="mt-3">
        <button type="button" class="btn btn-primary w-100 mb-2" id="btnFinalizar" onclick="finalizarCompra()">
          Finalizar compra
        </button>
        <button type="button" class="btn btn-danger w-100" id="btnVaciar" onclick="vaciarCarrito()">
          Eliminar todos los productos
        </button>
      </div>
    </div>
  </div>

  <!-- ================= FOOTER ================= -->
  <footer class="pie-pagina text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">MiTienda &copy; 2025 - Laboratorio de Aplicaciones Web Cliente</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 para los mensajes al usuario -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Mis scripts -->
  <script src="js/carrito.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
