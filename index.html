<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiTienda - E-commerce</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Tipografia de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Mi hoja de estilos -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ================= HEADER / NAVBAR ================= -->
  <header>
    <nav class="navbar navbar-dark barra-principal">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <i class="bi bi-bag-heart-fill"></i> MiTienda
        </a>
      </div>
    </nav>
  </header>

  <!-- ================= CONTENIDO PRINCIPAL ================= -->
  <main class="container my-4">

    <section aria-labelledby="tituloProductos">
      <h1 id="tituloProductos" class="titulo-seccion">Nuestros productos</h1>

      <!-- spinner mientras carga la api -->
      <div id="cargando" class="text-center my-5">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2">Cargando productos...</p>
      </div>

      <!-- aca se cargan las cards de los productos -->
      <div id="contenedorProductos" class="row g-4"></div>
    </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="pie-pagina text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">MiTienda &copy; 2025 - Laboratorio de Aplicaciones Web Cliente</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
